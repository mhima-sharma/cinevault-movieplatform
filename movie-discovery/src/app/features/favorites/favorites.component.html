<div class="mx-auto max-w-[1600px] px-4 md:px-8 py-8">
  <h1 class="text-2xl md:text-3xl font-extrabold text-white">My Favorites</h1>
  <p class="mt-2 text-sm text-gray-400">{{ favorites().length }} title{{ favorites().length === 1 ? '' : 's' }} saved</p>

  <div class="mt-8">
    @if (favorites().length === 0) {
      <app-empty-state title="No favorites yet" message="Tap the heart icon on any title to save it here." />
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        @for (entry of favorites(); track entry.card.id + entry.mediaType) {
          <app-movie-card [item]="entry.card" [mediaType]="entry.mediaType" />
        }
      </div>
    }
  </div>
</div>
