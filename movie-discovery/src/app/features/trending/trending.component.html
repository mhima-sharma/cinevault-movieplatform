<div class="mx-auto max-w-[1600px] px-4 md:px-8 py-8">
  <h1 class="text-2xl md:text-3xl font-extrabold text-white">Trending</h1>

  <div class="mt-6 flex flex-wrap items-center justify-between gap-4">
    <div class="flex gap-2">
      <button
        type="button"
        (click)="setMediaTab('movie')"
        class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [class]="mediaTab() === 'movie' ? 'bg-[var(--color-accent)] text-white' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
      >
        Movies
      </button>
      <button
        type="button"
        (click)="setMediaTab('tv')"
        class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [class]="mediaTab() === 'tv' ? 'bg-[var(--color-accent)] text-white' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
      >
        TV Shows
      </button>
    </div>

    <div class="flex gap-2">
      <button
        type="button"
        (click)="setTimeWindow('day')"
        class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [class]="timeWindow() === 'day' ? 'bg-white text-black' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
      >
        Today
      </button>
      <button
        type="button"
        (click)="setTimeWindow('week')"
        class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [class]="timeWindow() === 'week' ? 'bg-white text-black' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
      >
        This Week
      </button>
    </div>
  </div>

  <div class="mt-8">
    @if (trending.error()) {
      <app-error-message (retry)="trending.reload()" />
    } @else if (trending.loading()) {
      <app-movie-grid-skeleton [count]="18" />
    } @else if (cards().length === 0) {
      <app-empty-state title="Nothing trending" message="Check back soon." />
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        @for (item of cards(); track item.id) {
          <app-movie-card [item]="item" [mediaType]="mediaTab()" />
        }
      </div>
    }
  </div>
</div>
