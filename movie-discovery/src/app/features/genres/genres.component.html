<div class="mx-auto max-w-[1600px] px-4 md:px-8 py-8">
  <h1 class="text-2xl md:text-3xl font-extrabold text-white">Browse by Genre</h1>
  <p class="mt-2 text-sm text-gray-400">Pick a genre to explore movies that match your mood.</p>

  <div class="mt-8 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    @for (genre of genreService.movieGenres(); track genre.id; let i = $index) {
      <a
        [routerLink]="['/genres', genre.id]"
        [queryParams]="{ name: genre.name }"
        class="group relative flex h-28 items-center justify-center overflow-hidden rounded-xl border border-white/10 bg-gradient-to-br p-4 text-center transition-transform hover:-translate-y-1"
        [class]="gradientFor(i)"
      >
        <span class="relative z-10 text-lg font-bold text-white drop-shadow">{{ genre.name }}</span>
      </a>
    }
  </div>
</div>
