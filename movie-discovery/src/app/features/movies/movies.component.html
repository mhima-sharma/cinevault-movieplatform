<div class="mx-auto max-w-[1600px] px-4 md:px-8 py-8">
  <h1 class="text-2xl md:text-3xl font-extrabold text-white">Movies</h1>

  <!-- Category tabs -->
  <div class="mt-6 flex flex-wrap gap-2">
    @for (category of categories; track category[0]) {
      <button
        type="button"
        (click)="selectCategory(category[0])"
        class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [class]="!isFiltering() && activeCategory() === category[0] ? 'bg-[var(--color-accent)] text-white' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
      >
        {{ category[1] }}
      </button>
    }
  </div>

  <!-- Genre filter + sort -->
  <div class="mt-4 flex flex-col md:flex-row md:items-center gap-3 md:gap-4">
    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        (click)="selectGenre(null)"
        class="rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
        [class]="selectedGenre() === null ? 'bg-white text-black' : 'bg-[var(--color-surface)] text-gray-400 hover:bg-white/10'"
      >
        All Genres
      </button>
      @for (genre of genreService.movieGenres(); track genre.id) {
        <button
          type="button"
          (click)="selectGenre(genre.id)"
          class="rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
          [class]="selectedGenre() === genre.id ? 'bg-white text-black' : 'bg-[var(--color-surface)] text-gray-400 hover:bg-white/10'"
        >
          {{ genre.name }}
        </button>
      }
    </div>

    <div class="flex gap-3 md:ml-auto">
      <select
        [value]="selectedLanguage() ?? ''"
        (change)="selectLanguage($any($event.target).value || null)"
        aria-label="Filter by language"
        class="rounded-full border border-white/10 bg-[var(--color-surface)] px-4 py-2 text-sm text-white outline-none focus:border-[var(--color-accent)]"
      >
        <option value="">All Languages</option>
        @for (option of languageOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>

      <select
        [value]="sortBy()"
        (change)="onSortChange($any($event.target).value)"
        aria-label="Sort movies"
        class="rounded-full border border-white/10 bg-[var(--color-surface)] px-4 py-2 text-sm text-white outline-none focus:border-[var(--color-accent)]"
      >
        @for (option of sortOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Grid -->
  <div class="mt-8">
    @if (movies.error()) {
      <app-error-message (retry)="movies.reload()" />
    } @else if (movies.loading()) {
      <app-movie-grid-skeleton [count]="18" />
    } @else if (cards().length === 0) {
      <app-empty-state title="No movies found" message="Try a different genre or category." />
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        @for (movie of cards(); track movie.id) {
          <app-movie-card [item]="movie" mediaType="movie" />
        }
      </div>

      <app-pagination [page]="page()" [totalPages]="totalPages()" (pageChange)="onPageChange($event)" />
    }
  </div>
</div>
