<div class="mx-auto max-w-[1600px] px-4 md:px-8 py-8">
  <h1 class="text-2xl md:text-3xl font-extrabold text-white">TV Shows</h1>

  <div class="mt-6 flex flex-wrap gap-2">
    @for (category of categories; track category[0]) {
      <button
        type="button"
        (click)="selectCategory(category[0])"
        class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [class]="activeCategory() === category[0] ? 'bg-[var(--color-accent)] text-white' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
      >
        {{ category[1] }}
      </button>
    }
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <button
      type="button"
      (click)="selectGenre(null)"
      class="rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
      [class]="selectedGenre() === null ? 'bg-white text-black' : 'bg-[var(--color-surface)] text-gray-400 hover:bg-white/10'"
    >
      All Genres
    </button>
    @for (genre of genreService.tvGenres(); track genre.id) {
      <button
        type="button"
        (click)="selectGenre(genre.id)"
        class="rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
        [class]="selectedGenre() === genre.id ? 'bg-white text-black' : 'bg-[var(--color-surface)] text-gray-400 hover:bg-white/10'"
      >
        {{ genre.name }}
      </button>
    }
  </div>

  <div class="mt-8">
    @if (shows.error()) {
      <app-error-message (retry)="shows.reload()" />
    } @else if (shows.loading()) {
      <app-movie-grid-skeleton [count]="18" />
    } @else if (cards().length === 0) {
      <app-empty-state title="No TV shows found" message="Try a different genre or category." />
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        @for (show of cards(); track show.id) {
          <app-movie-card [item]="show" mediaType="tv" />
        }
      </div>

      <app-pagination [page]="page()" [totalPages]="totalPages()" (pageChange)="onPageChange($event)" />
    }
  </div>
</div>
