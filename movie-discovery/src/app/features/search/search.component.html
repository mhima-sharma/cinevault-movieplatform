<div class="mx-auto max-w-[1600px] px-4 md:px-8 py-8">
  <h1 class="text-2xl md:text-3xl font-extrabold text-white">Search</h1>

  <div class="mt-6 max-w-xl">
    <app-search-bar [initialValue]="q()" (search)="onSearch($event)" />
  </div>

  <div class="mt-4 flex gap-2">
    <button
      type="button"
      (click)="setTab('movie')"
      class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
      [class]="tab() === 'movie' ? 'bg-[var(--color-accent)] text-white' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
    >
      Movies
    </button>
    <button
      type="button"
      (click)="setTab('tv')"
      class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
      [class]="tab() === 'tv' ? 'bg-[var(--color-accent)] text-white' : 'bg-[var(--color-surface)] text-gray-300 hover:bg-white/10'"
    >
      TV Shows
    </button>
  </div>

  <div class="mt-8">
    @if (!hasSearched()) {
      <app-empty-state title="Search CineVault" message="Find movies and TV shows by title." />
    } @else if (results.error()) {
      <app-error-message (retry)="results.reload()" />
    } @else if (results.loading()) {
      <app-movie-grid-skeleton [count]="12" />
    } @else if (cards().length === 0) {
      <app-empty-state title="No results found" [message]="'Nothing matched \'' + query() + '\'. Try a different search.'" />
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        @for (item of cards(); track item.id) {
          <app-movie-card [item]="item" [mediaType]="tab()" />
        }
      </div>

      <app-pagination [page]="page()" [totalPages]="totalPages()" (pageChange)="onPageChange($event)" />
    }
  </div>
</div>
